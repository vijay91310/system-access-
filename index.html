<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-box {
            border: 2px solid #0f0;
            padding: 40px;
            background: rgba(0, 20, 0, 0.8);
            box-shadow: 0 0 20px #0f0;
            text-align: center;
            border-radius: 10px;
            width: 300px;
        }
        h2 {
            margin: 0 0 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #0f0;
        }
        p {
            font-size: 11px;
            color: #0a0;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 10px #0f0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0f0;
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px #0f0;
            transition: 0.3s;
        }
        button:hover {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <h2>SYSTEM ACCESS</h2>
        <p>IDENTITY VERIFICATION REQUIRED</p>
        <div class="input-group">
            <input type="text" id="username" placeholder="USERNAME" value="VIJAY1437">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="PASSWORD" value="143712">
        </div>
        <button type="button" onclick="login()">AUTHENTICATE</button>
    </div>

    <script>
        function login() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;

            // यहाँ आपका सही यूजरनेम और पासवर्ड चेक हो रहा है
            if (user === "VIJAY1437" && pass === "143712") {
                document.getElementById("loginBox").innerHTML = `
                    <h2 style="color: #0f0; text-shadow: 0 0 10px #0f0;">ACCESS GRANTED</h2>
                    <p style="color: #0f0; font-size: 14px; margin-top: 20px;">Welcome back, VIJAY1437.</p>
                    <div style="border: 1px dashed #0f0; padding: 15px; margin-top: 20px; font-weight: bold;">
                        ⚙️ SYSTEM ONLINE <br> 🔒 SECURE CONNECTION ESTABLISHED
                    </div>
                `;
            } else {
                alert("ACCESS DENIED: Invalid Credentials!");
            }
        }
    </script>
</body>
</html>
